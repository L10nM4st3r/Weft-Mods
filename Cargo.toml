[package]
name = "lions_mods"
version = "0.1.1"
edition = "2024"

[dependencies]
weft_sdk = { git = "https://github.com/Weft-Rust/Weft", tag="v26.11.4" }
base_api = { git = "https://github.com/Weft-Rust/Weft", tag="v26.11.4" }
lion_lib = { path = "lion_lib" }
slow_start_api = { path = "slow_start/api" }
tetanus_api = { path = "tetanus/api" }


[workspace]

[profile.release]
# How much debug information to keep. "line-tables-only" is enough for crash reports and
# panics to name the line. false = none, true = everything (big).
debug = "line-tables-only"
