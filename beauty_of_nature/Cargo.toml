[package]
name = "beauty_of_nature"
version = "0.1.0"
edition = "2024"

[lib]
# Mandatory
crate-type = ["cdylib"]
# Only if the library must be named differently from the package:
# name = "examplemod"

[dependencies]
weft_sdk = { path = "../../crates/sdk" }
base_api = { path = "../base/api" }
base = { path = "../base" }


[workspace]

[profile.release]
# How much debug information to keep. "line-tables-only" is enough for crash reports and
# panics to name the line. false = none, true = everything (big).
debug = "line-tables-only"
