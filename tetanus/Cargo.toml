[package]
name = "tetanus"
version = "0.1.0"
edition = "2024"


[lib]
# Mandatory
crate-type = ["cdylib"]
# Only if the library must be named differently from the package:
# name = "examplemod"

[dependencies]
weft_sdk = { git = "https://github.com/Weft-Rust/Weft", branch = "master" tag="v26.11.4" }
base_api = { git = "https://github.com/Weft-Rust/Weft", branch = "master" tag="v26.11.4" }
tetanus_api = { path = "api" }

[workspace]

[profile.release]
# How much debug information to keep. "line-tables-only" is enough for crash reports and
# panics to name the line. false = none, true = everything (big).
debug = "line-tables-only"
